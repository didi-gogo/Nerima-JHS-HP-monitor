<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>練馬区立中学校 情報巡回ツール</title>
  <style>
    :root { color: #172033; background: #f4f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    .container { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 32px 0 48px; }
    h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 2rem); }
    .lead, .muted { color: #5b667a; }
    .lead { margin: 0 0 20px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
    button { border: 0; border-radius: 7px; padding: 10px 15px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .primary { color: white; background: #155eef; }
    .secondary { color: #23314d; background: #e8edf5; }
    .danger { color: #9f1c1c; background: #fee2e2; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
    .summary > div { background: white; border: 1px solid #dfe5ec; border-radius: 9px; padding: 13px 15px; }
    .summary strong { display: block; font-size: 1.45rem; }
    .summary span { color: #5b667a; font-size: .84rem; }
    .notice { border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
    .notice.info { background: #e8f1ff; color: #1849a9; }
    .notice.error { background: #feecec; color: #9f1c1c; }
    .hidden { display: none; }
    .table-wrap { overflow-x: auto; background: white; border: 1px solid #dfe5ec; border-radius: 10px; }
    table { width: 100%; border-collapse: collapse; min-width: 930px; }
    th, td { padding: 12px 13px; border-bottom: 1px solid #e7ebf0; text-align: left; vertical-align: middle; }
    th { background: #f6f8fa; color: #39465e; font-size: .78rem; }
    tbody tr:last-child td { border-bottom: 0; }
    tr.is-updated { background: #fff8df; }
    tr.has-error { background: #fff2f2; }
    .school-name { font-weight: 700; }
    .latest { max-width: 380px; }
    .latest a { color: #175cd3; }
    .latest time { display: block; color: #6b7382; font-size: .78rem; margin-top: 3px; }
    .badge { display: inline-block; border-radius: 999px; padding: 4px 9px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
    .badge.updated { color: #92400e; background: #fde68a; }
    .badge.ok { color: #166534; background: #dcfce7; }
    .badge.pending { color: #3f4c63; background: #e9edf3; }
    .badge.error { color: #991b1b; background: #fee2e2; }
    .visit { color: white; background: #18794e; padding: 7px 11px; font-size: .82rem; }
    footer { margin-top: 20px; color: #6b7382; font-size: .82rem; text-align: center; }
    @media (max-width: 720px) {
      .container { width: min(100% - 20px, 1180px); padding-top: 20px; }
      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>練馬区立中学校 情報巡回ツール</h1>
      <p class="lead">33校のホームページ更新を自動確認します。「訪問」を押すと、その時点までを確認済みにします。</p>
      <div class="toolbar">
        <button id="refreshBtn" class="primary" type="button">最新状態を再読み込み</button>
        <button id="openUpdatedBtn" class="secondary" type="button">更新校を順に開く</button>
        <button id="clearDataBtn" class="danger" type="button">確認履歴をクリア</button>
      </div>
      <div id="loadingNotice" class="notice info">最新の監視結果を読み込んでいます。</div>
      <div id="errorNotice" class="notice error hidden" role="alert"></div>
      <div class="summary" aria-label="監視状況の概要">
        <div><strong id="updatedCount">-</strong><span>更新あり</span></div>
        <div><strong id="checkedCount">-</strong><span>確認済み</span></div>
        <div><strong id="errorCount">-</strong><span>取得エラー</span></div>
        <div><strong id="lastChecked">-</strong><span>監視データ取得日時</span></div>
      </div>
    </header>

    <main class="table-wrap">
      <table>
        <thead>
          <tr><th scope="col">番号</th><th scope="col">学校名</th><th scope="col">最新情報</th><th scope="col">状態</th><th scope="col">最終訪問</th><th scope="col">操作</th></tr>
        </thead>
        <tbody id="schoolList"></tbody>
      </table>
    </main>

    <footer><p>監視結果はGitHub Actionsで3時間ごとに更新します。学校サイトの取得失敗は「取得エラー」として表示します。</p></footer>
  </div>

  <script>
    const STORAGE_KEY = 'nerimaSchoolsMonitorAcknowledgementsV2';
    let monitorData = null;

    function loadAcknowledgements() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
      catch (error) { console.warn('確認履歴を読み込めませんでした', error); return {}; }
    }
    function saveAcknowledgements(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[char]);
    }
    function safeUrl(value) {
      try { const url = new URL(value); return url.protocol === 'https:' ? url.href : '#'; }
      catch { return '#'; }
    }
    function formatDate(value, short = false) {
      if (!value) return '-';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '-';
      return new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo', year: short ? undefined : 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', hour12: false
      }).format(date);
    }
    function getViewState(school, acknowledgements) {
      if (school.error || !school.currentHash) return 'error';
      const acknowledgement = acknowledgements[school.id];
      if (!acknowledgement?.hash) return 'pending';
      return acknowledgement.hash === school.currentHash ? 'ok' : 'updated';
    }
    function render() {
      if (!monitorData?.schools) return;
      const acknowledgements = loadAcknowledgements();
      const list = document.getElementById('schoolList');
      const counts = { updated: 0, ok: 0, pending: 0, error: 0 };
      list.innerHTML = monitorData.schools.map(school => {
        const state = getViewState(school, acknowledgements);
        counts[state]++;
        const acknowledgement = acknowledgements[school.id];
        const label = { updated: '更新あり', ok: '確認済み', pending: '初回確認待ち', error: '取得エラー' }[state];
        const latestUrl = safeUrl(school.latest?.link);
        const latestTitle = school.latest?.title
          ? `<a href="${escapeHtml(latestUrl)}" target="_blank" rel="noopener noreferrer">${escapeHtml(school.latest.title)}</a>`
          : '<span class="muted">情報なし</span>';
        const latestDate = school.latest?.publishedAt ? `<time>${escapeHtml(formatDate(school.latest.publishedAt))}</time>` : '';
        return `<tr class="${state === 'updated' ? 'is-updated' : ''} ${state === 'error' ? 'has-error' : ''}">
          <td>${escapeHtml(school.id)}</td><td class="school-name">${escapeHtml(school.name)}</td>
          <td class="latest">${latestTitle}${latestDate}</td><td><span class="badge ${state}">${label}</span></td>
          <td>${escapeHtml(formatDate(acknowledgement?.visitedAt))}</td>
          <td><button class="visit" type="button" data-school-id="${escapeHtml(school.id)}">訪問</button></td></tr>`;
      }).join('');
      document.getElementById('updatedCount').textContent = counts.updated;
      document.getElementById('checkedCount').textContent = counts.ok;
      document.getElementById('errorCount').textContent = counts.error;
      document.getElementById('lastChecked').textContent = formatDate(monitorData.checkedAt, true);
      list.querySelectorAll('.visit').forEach(button => button.addEventListener('click', () => visitSchool(Number(button.dataset.schoolId))));
    }
    function visitSchool(id) {
      const school = monitorData.schools.find(item => item.id === id);
      if (!school) return;
      window.open(safeUrl(school.url), '_blank', 'noopener');
      if (school.currentHash) {
        const acknowledgements = loadAcknowledgements();
        acknowledgements[id] = { hash: school.currentHash, visitedAt: new Date().toISOString() };
        saveAcknowledgements(acknowledgements);
        render();
      }
    }
    async function loadStatus() {
      const refreshButton = document.getElementById('refreshBtn');
      const loadingNotice = document.getElementById('loadingNotice');
      const errorNotice = document.getElementById('errorNotice');
      refreshButton.disabled = true;
      loadingNotice.classList.remove('hidden');
      errorNotice.classList.add('hidden');
      try {
        const response = await fetch(`data/status.json?t=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) throw new Error(`監視データの取得に失敗しました（HTTP ${response.status}）`);
        const data = await response.json();
        if (data.schemaVersion !== 2 || !Array.isArray(data.schools)) throw new Error('監視データの形式が不正です');
        monitorData = data;
        render();
      } catch (error) {
        errorNotice.textContent = `${error.message}。しばらく待ってから再読み込みしてください。`;
        errorNotice.classList.remove('hidden');
      } finally {
        refreshButton.disabled = false;
        loadingNotice.classList.add('hidden');
      }
    }
    function openUpdatedSchools() {
      if (!monitorData) return;
      const acknowledgements = loadAcknowledgements();
      const updated = monitorData.schools.filter(school => getViewState(school, acknowledgements) === 'updated');
      if (!updated.length) { alert('更新ありの学校はありません。'); return; }
      if (!confirm(`${updated.length}校を新しいタブで開き、確認済みにします。よろしいですか？`)) return;
      updated.forEach(school => window.open(safeUrl(school.url), '_blank', 'noopener'));
      const now = new Date().toISOString();
      updated.forEach(school => { acknowledgements[school.id] = { hash: school.currentHash, visitedAt: now }; });
      saveAcknowledgements(acknowledgements);
      render();
    }
    document.getElementById('refreshBtn').addEventListener('click', loadStatus);
    document.getElementById('openUpdatedBtn').addEventListener('click', openUpdatedSchools);
    document.getElementById('clearDataBtn').addEventListener('click', () => {
      if (confirm('この端末に保存した確認履歴をすべて削除します。よろしいですか？')) { localStorage.removeItem(STORAGE_KEY); render(); }
    });
    loadStatus();
  </script>
</body>
</html>
