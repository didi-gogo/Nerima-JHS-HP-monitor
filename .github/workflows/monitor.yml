name: Monitor school websites

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - ".github/workflows/monitor.yml"
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: school-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run monitor tests
        run: python3 -m unittest discover -s tests -v
      - name: Fetch and compare 33 school websites
        run: python3 scripts/monitor.py
      - name: Preserve failed monitoring diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: monitor-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/status.json
          retention-days: 7
      - name: Commit the monitoring snapshot
        run: |
          if git diff --quiet -- data/status.json; then
            echo "No snapshot changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status.json
          git commit -m "Update school monitoring snapshot"
          git push
